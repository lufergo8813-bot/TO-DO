<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Tareas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Tareas">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1d2433;--mute:#6a7385;--bg:#eef1f5;--sur:#fff;--line:#dfe4ec;--acc:#0e7c86;--accd:#0a5d65;
--per-b:#ead9f7;--per-t:#5b1f8c;--p1-b:#d3e5ff;--p1-t:#1b4b9b;--p2-b:#fdeab0;--p2-t:#7a5500;--p3-b:#ffd8d3;--p3-t:#9c2519;--done-b:#d6efdd;--done-t:#1d6338}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{margin:0;font-size:1.3rem;letter-spacing:.2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--sur);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;color:var(--ink)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;overflow:auto;position:relative}
.banner{margin:10px 12px 0;background:#fff4d6;border:1px solid #f0d58a;border-radius:10px;padding:9px 12px;font-size:.9rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem}
.board{display:flex;gap:12px;padding:12px;min-height:100%;overflow-x:auto;scroll-snap-type:x mandatory;align-items:flex-start}
.col{flex:none;width:min(80vw,310px);scroll-snap-align:start;background:#e4e8ef;border-radius:12px;padding:8px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
.tag{font-weight:700;font-size:.82rem;padding:3px 9px;border-radius:6px}
.tag small{font-weight:600;opacity:.7;margin-left:4px}
.t-per{background:var(--per-b);color:var(--per-t)}.t-p1{background:var(--p1-b);color:var(--p1-t)}.t-p2{background:var(--p2-b);color:var(--p2-t)}.t-p3{background:var(--p3-b);color:var(--p3-t)}.t-done{background:var(--done-b);color:var(--done-t)}
.plus{border:0;background:transparent;font-size:1.4rem;line-height:1;color:var(--mute);padding:2px 8px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--sur);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,30,50,.12)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);background:#fff;margin-top:1px;padding:0;color:#fff;font-size:14px;line-height:1}
.done .chk{background:var(--acc)}
.done .tt{text-decoration:line-through;color:var(--mute)}
.ct{flex:1;min-width:0}
.tt{font-weight:600;overflow-wrap:anywhere}
.mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;font-size:.78rem;color:var(--mute)}
.cc{background:#e8f3f4;color:var(--accd);border-radius:5px;padding:1px 7px;font-weight:600}
.late{color:#b42318;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:18px 8px;font-size:.9rem}
.list{padding:12px;max-width:640px;margin:0 auto}
.list h2{font-size:.95rem;margin:14px 2px 8px;color:var(--accd)}
.pbadge{border-radius:5px;padding:1px 7px;font-weight:700}
nav{display:flex;background:var(--sur);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font:inherit;font-size:.8rem;color:var(--mute)}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:2rem;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.more{padding:14px;max-width:560px;margin:0 auto}
.more .box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.more h3{margin:0 0 6px;font-size:1rem}
.more p{margin:0 0 10px;color:var(--mute);font-size:.9rem}
.btn{border:0;background:var(--acc);color:#fff;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600}
.btn.sec{background:#e8f3f4;color:var(--accd)}.btn.del{background:#fde8e6;color:#b42318}
.ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet label{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=date],.sheet select,.sheet textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.sheet textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;gap:8px;align-items:center;padding:5px 0}
.step span{flex:1}.step .x{border:0;background:none;color:var(--mute);font-size:1.2rem}
.step.sd span{text-decoration:line-through;color:var(--mute)}
.chk.s{width:20px;height:20px;font-size:12px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.card{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.card.ph{opacity:.35}
.ghost{position:fixed;z-index:20;pointer-events:none;margin:0;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(2deg)}
.col.over{outline:3px dashed var(--acc);outline-offset:-3px}
.dragging .board{scroll-snap-type:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sw span{width:100%;font-size:.8rem;font-weight:600;color:var(--mute)}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.wk{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.wk button{border:0;background:#fff;border-radius:8px;padding:6px 16px;font-size:1.3rem;color:var(--acc)}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh h2{margin:14px 2px 8px}
.today h2{color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc);display:inline-block}
nav button{font-size:.72rem;padding:10px 2px 9px}
.bd{background:#e5484d;color:#fff;border-radius:99px;font-size:.65rem;padding:1px 6px;margin-left:3px}
.seg{display:flex;margin:10px 12px 0;background:#dfe4ec;border-radius:10px;padding:3px;max-width:340px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;font-size:.85rem;color:var(--mute)}
.seg .on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.qa{display:flex;gap:8px;margin-bottom:6px}
.qa input{flex:1;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;min-width:0}
.hint{color:var(--mute);font-size:.85rem;margin:6px 2px 12px}
.card.inb{flex-wrap:wrap}
.asg{flex-basis:100%;display:flex;gap:8px;padding-left:34px}
.asg select,.asg input{flex:1;min-width:0;font:inherit;font-size:.88rem;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.xt{border-collapse:collapse;font-size:.82rem;width:100%}
.xt td,.xt th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.xt th{background:#e8f3f4}
.hr{display:flex;align-items:center;justify-content:space-between}
.ib{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;padding:0}
.sb{display:flex;gap:8px;margin-top:8px}
.sb[hidden]{display:none}
.sb input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:0;border-radius:10px}
.sx{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;width:40px;font-size:1.4rem;padding:0}
.card.insb{box-shadow:0 -4px 0 var(--acc)}
.card.insa{box-shadow:0 4px 0 var(--acc)}
.rd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rd span{width:100%;font-size:.8rem;font-weight:600;color:var(--mute)}
.rd button{min-width:40px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:.85rem;padding:0 8px;color:var(--ink)}
.rd button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5a524;outline-offset:2px}
@media(min-width:760px){.col{width:300px}.ov{align-items:center}.sheet{border-radius:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hr"><h1>✓ Mis Tareas</h1><button class="ib" id="sbtn" aria-label="Buscar tarea"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button></div>
<div class="sb" id="sb" hidden><input type="search" id="q" placeholder="Buscar en título, notas, pasos o categoría" aria-label="Buscar tarea" autocomplete="off"><button class="sx" id="qx" aria-label="Cerrar búsqueda">×</button></div></header>
<div class="chips" id="chips"></div>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Nueva tarea">+</button>
<nav id="nav">
  <button data-v="board">Tablero</button>
  <button data-v="inbox">Bandeja</button>
  <button data-v="day">Mi día</button>
  <button data-v="week">Semana</button>
  <button data-v="plan">Planeadas</button>
  <button data-v="more">Respaldo</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="xfile" accept=".xlsx,.xls,.json,application/json" hidden>

<script>
const KEY='tareas_v1';
const P={per:'Periódicas',p1:'Prioridad 1',p2:'Prioridad 2',p3:'Prioridad 3'};
const REP={'':'No se repite',d:'Cada día',w:'Cada semana',m:'Cada mes',wd:'Días de la semana…',md:'Días del mes…'};
const WD=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],WORD=[1,2,3,4,5,6,0];
let S=load(),view='board',cat='',draft=null,isNew=false,wk=0,importMode='merge',q='';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!d||!Array.isArray(d.tasks))d={tasks:[],lastBackup:0};d.cc=d.cc||{};d.del=d.del||{};ensureOrd(d);d.catList=Array.isArray(d.catList)?d.catList:[];return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}}
function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms||2200)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function nextMatch(r,rd,base,inc){
  for(let i=inc?0:1;i<=62;i++){
    const ds=addDays(base,i),d=new Date(ds+'T12:00:00');
    if(r==='wd'){if(rd.includes(d.getDay()))return ds}
    else{const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();if(rd.some(x=>(x===0?last:Math.min(x,last))===d.getDate()))return ds}
  }
  return'';
}
function nextDue(s,r,rd){
  const t0=today();
  if((r==='wd'||r==='md')&&rd&&rd.length){const x=nextMatch(r,rd,s&&s>t0?s:t0,false);if(x)return x}
  if(r==='wd')r='w';if(r==='md')r='m';
  const d=new Date((s||t0)+'T12:00:00');
  if(r==='d')d.setDate(d.getDate()+1);else if(r==='w')d.setDate(d.getDate()+7);
  else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}
  return ymd(d);
}
function repTxt(t){
  const rd=t.rd||[];
  if(t.rep==='wd'&&rd.length)return' '+WORD.filter(n=>rd.includes(n)).map(n=>WD[n]).join(', ');
  if(t.rep==='md'&&rd.length)return' día '+[...rd].sort((a,b)=>(a||99)-(b||99)).map(n=>n===0?'último':n).join(', ');
  return'';
}
function fmt(s){const t=today();if(s===t)return'Hoy';if(s===addDays(t,1))return'Mañana';return new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function cats(){return[...new Set([...S.tasks.map(t=>t.cat).filter(Boolean),...(S.catList||[])])].sort((a,b)=>a.localeCompare(b,'es'))}
function syncCats(){S.catList=S.catList||[];S.tasks.forEach(t=>{if(t.cat&&!S.catList.includes(t.cat))S.catList.push(t.cat)})}
const PAL=[['#e8f3f4','#0a5d65'],['#ead9f7','#5b1f8c'],['#d3e5ff','#1b4b9b'],['#fdeab0','#7a5500'],['#ffd8d3','#9c2519'],['#d6efdd','#1d6338'],['#ffe1c7','#8a3b00'],['#f9d5ea','#8a1c5c']];
function ci(n){if(S.cc[n]!=null)return S.cc[n];let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return h%PAL.length}
function cstyle(n){const p=PAL[ci(n)];return'background:'+p[0]+';color:'+p[1]}
const BM=()=>S.bm==='cat'?'cat':'prio';
function pb(t){return t.prio?`<span class="pbadge t-${t.prio}">${P[t.prio]}</span> `:'<span class="pbadge" style="background:#e4e8ef;color:#444">Bandeja</span> '}
function mt(t){return!q||nk(t.title+' '+(t.notes||'')+' '+(t.cat||'')+' '+(t.steps||[]).map(s=>s.t).join(' ')).includes(q)}
function vis(t){return(!cat||t.cat===cat)&&mt(t)}

function card(t){
  const m=[];
  if(t.cat)m.push(`<span class="cc" style="${cstyle(t.cat)}">${esc(t.cat)}</span>`);
  if(t.due)m.push(`<span class="${!t.done&&t.due<today()?'late':''}">📅 ${fmt(t.due)}</span>`);
  if(t.rep)m.push('<span>🔁'+repTxt(t)+'</span>');
  if(t.steps&&t.steps.length)m.push(`<span>☰ ${t.steps.filter(s=>s.d).length}/${t.steps.length}</span>`);
  if(t.notes)m.push('<span>📝</span>');
  if(t.myday===today()&&!t.done)m.push('<span>☀ Mi día</span>');
  return `<div class="card ${t.done?'done':''}" data-id="${t.id}"><button class="chk" data-act="tog" aria-label="${t.done?'Reabrir':'Completar'} tarea">${t.done?'✓':''}</button><div class="ct" data-act="edit" tabindex="0" role="button"><div class="tt">${esc(t.title)}</div>${m.length?`<div class="mt">${m.join('')}</div>`:''}</div></div>`;
}
function sortT(a,b){return(a.due||'9999').localeCompare(b.due||'9999')||a.title.localeCompare(b.title,'es')}
const byOrd=(a,b)=>(a.ord||0)-(b.ord||0);
function nextOrd(){return S.tasks.reduce((m,t)=>Math.max(m,t.ord||0),0)+1000}
function renumber(){[...S.tasks].sort(byOrd).forEach((t,i)=>{t.ord=(i+1)*1000})}
function ensureOrd(d){
  const miss=d.tasks.filter(t=>typeof t.ord!=='number');if(!miss.length)return;
  let m=d.tasks.reduce((a,t)=>Math.max(a,typeof t.ord==='number'?t.ord:0),0);
  miss.sort(sortT).forEach(t=>{m+=1000;t.ord=m});
}

function renderChips(){
  const c=cats();
  $('chips').style.display=(view==='more'||view==='inbox'||(view==='board'&&BM()==='cat')||!c.length)?'none':'flex';
  $('chips').innerHTML=`<button data-c="" class="${cat===''?'on':''}">Todas</button>`+c.map(x=>`<button data-c="${esc(x)}" class="${cat===x?'on':''}"><i class="dot" style="background:${PAL[ci(x)][1]}"></i>${esc(x)}</button>`).join('');
}
function bannerHTML(){
  if(!S.tasks.length)return'';
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(days!==null&&days<7)return'';
  return`<div class="banner"><span>${days===null?'Aún no has hecho un respaldo.':'Hace '+days+' días no haces respaldo.'}</span><button data-act="export">Exportar</button></div>`;
}
function renderBoard(){
  const cols=Object.keys(P).map(k=>{
    const l=S.tasks.filter(t=>!t.done&&t.prio===k&&vis(t)).sort(byOrd);
    return`<section class="col" data-k="${k}"><div class="colh"><span class="tag t-${k}">${P[k]}<small>${l.length}</small></span><button class="plus" data-act="add" data-p="${k}" aria-label="Agregar en ${P[k]}">+</button></div>${l.map(card).join('')||'<div class="empty">Sin tareas</div>'}</section>`;
  });
  const d=S.tasks.filter(t=>t.done&&vis(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  cols.push(`<section class="col" data-k="done"><div class="colh"><span class="tag t-done">Hecho<small>${d.length}</small></span></div>${d.slice(0,30).map(card).join('')||'<div class="empty">Aquí aparecen las completadas</div>'}</section>`);
  return segHTML()+bannerHTML()+`<div class="board">${cols.join('')}</div>`;
}
function segHTML(){const m=BM();return`<div class="seg"><button data-act="bm" data-m="prio" class="${m==='prio'?'on':''}">Por prioridad</button><button data-act="bm" data-m="cat" class="${m==='cat'?'on':''}">Por categoría</button></div><p class="hint" style="margin:6px 14px 0">Mantén presionada una tarjeta y arrástrala para ordenarla o cambiarla de columna.</p>`}
function renderCatBoard(){
  const o={p1:0,p2:1,p3:2,per:3};
  const cols=[...cats(),''].map(n=>{
    const l=S.tasks.filter(t=>!t.done&&t.prio&&(t.cat||'')===n&&mt(t)).sort((a,b)=>o[a.prio]-o[b.prio]||byOrd(a,b));
    if(q&&!l.length)return'';
    const tag=n?`<span class="tag" style="${cstyle(n)}">${esc(n)}<small>${l.length}</small></span>`:`<span class="tag" style="background:#d9dee7;color:#444">Sin categoría<small>${l.length}</small></span>`;
    return`<section class="col" data-k="${esc(n)}"><div class="colh">${tag}<button class="plus" data-act="addc" data-cat="${esc(n)}" aria-label="Agregar en ${esc(n||'Sin categoría')}">+</button></div>${l.map(t=>card(t).replace('<div class="tt">','<div class="tt">'+pb(t))).join('')||'<div class="empty">Sin tareas</div>'}</section>`;
  }).join('');
  return segHTML()+bannerHTML()+`<div class="board">${cols}</div>`;
}
function renderInbox(){
  const l=S.tasks.filter(t=>!t.done&&!t.prio&&mt(t)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const it=t=>`<div class="card inb" data-id="${t.id}"><button class="chk" data-act="tog" aria-label="Completar tarea"></button><div class="ct" data-act="edit" tabindex="0" role="button"><div class="tt">${esc(t.title)}</div></div><div class="asg"><select data-f="prio" aria-label="Asignar prioridad"><option value="">Prioridad…</option>${Object.keys(P).map(k=>`<option value="${k}">${P[k]}</option>`).join('')}</select><input type="text" data-f="cat" list="cl2" value="${esc(t.cat)}" placeholder="Categoría" aria-label="Categoría" maxlength="40"></div></div>`;

  const rows=[['Tarea','Prioridad','Categoría','Fecha límite','Repetir','Notas','Pasos','Hecha','ID','Actualizada','Orden']];
  S.tasks.forEach(t=>rows.push([t.title,PN[t.prio]||'',t.cat||'',xdate(t.due),repXl(t),t.notes||'',(t.steps||[]).map(s=>(s.d?'✓ ':'')+s.t).join('; '),t.done?'Sí':'No',t.id,t.updatedAt||0,t.ord||0]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  for(let r=1;r<rows.length;r++){const c=ws[XLSX.utils.encode_cell({r,c:3})];if(c&&typeof c.v==='number')c.z='dd/mm/yyyy'}
  ws['!cols']=[38,14,16,13,14,32,40,8,14,16,10].map(w=>({wch:w}));
  const cs=catSheet();
  const ds=XLSX.utils.aoa_to_sheet([['ID','Eliminada (ms)'],...Object.keys(S.del).map(id=>[id,S.del[id]])]);ds['!cols']=[{wch:18},{wch:18}];
  const ls=XLSX.utils.aoa_to_sheet([['Respaldo de Mis Tareas'],['Exportado el '+new Date().toLocaleString('es-CO')],[''],['Hoja Tareas: tus tareas. Puedes editarla; no cambies las columnas ID ni Actualizada.'],['Hoja Categorías: tus categorías y su color (1 a 8). Agrega más filas y aparecerán en la lista desplegable de la columna Categoría.'],['Hoja Eliminadas: sirve para que un borrado también se aplique al fusionar con otro dispositivo. No la edites.'],['Para recuperar tus datos: en la app, Respaldo → Importar y fusionar (o Importar y reemplazar).']]);ls['!cols']=[{wch:100}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Tareas');XLSX.utils.book_append_sheet(wb,cs,'Categorías');XLSX.utils.book_append_sheet(wb,ds,'Eliminadas');XLSX.utils.book_append_sheet(wb,ls,'Léeme');
  return withValidations(XLSX.write(wb,{bookType:'xlsx',type:'array'}));
}
function xname(){return 'tareas-respaldo-'+today()+'.xlsx'}
async function exportData(){
  try{
    const blob=new Blob([await buildXlsxBytes()],{type:XMIME});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=xname();
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    S.lastBackup=Date.now();save();render();toast('Respaldo en Excel descargado');
  }catch(e){toast('No pude crear el Excel. Intenta de nuevo con internet',5000)}
}
async function shareData(){
  try{
    const f=new File([await buildXlsxBytes()],xname(),{type:XMIME});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Respaldo Mis Tareas'});S.lastBackup=Date.now();save();render();return}
      catch(e){if(e&&e.name==='AbortError')return}
    }
  }catch(e){}
  exportData();
}
function pdate(v){
  if(v===''||v==null)return'';
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}return''}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  return'';
}
function pprio(v){const s=nk(v);if(!s)return['',true];if(s.includes('period'))return['per',true];if(/(^|\D)1(\D|$)|^p1$|alta|urgente/.test(s))return['p1',true];if(/(^|\D)2(\D|$)|^p2$|media/.test(s))return['p2',true];if(/(^|\D)3(\D|$)|^p3$|baja/.test(s))return['p3',true];return['',false]}
function prep(v){const s=nk(v);if(s.includes('dia')||s==='d'||s.includes('diari'))return'd';if(s.includes('semana')||s==='w')return'w';if(s.includes('mes')||s==='m')return'm';return''}
async function readExcel(f){
  await loadXLSX();
  const wb=XLSX.read(await readBuf(f),{type:'array'});
  const ws=wb.Sheets['Tareas']||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>XH.title.includes(nk(c))));
  if(hi<0)throw new Error('header');
  const ix={};rows[hi].forEach((c,i)=>{const k=nk(c);for(const key in XH)if(ix[key]==null&&XH[key].includes(k))ix[key]=i});
  const g=(r,k)=>ix[k]==null?'':r[ix[k]];
  const rt=[];let badP=0,badD=0;
  rows.slice(hi+1).forEach(r=>{
    const title=String(g(r,'title')).trim();if(!title)return;
    const pr=pprio(g(r,'prio'));if(!pr[1])badP++;
    const dv=g(r,'due'),due=pdate(dv);if(dv!==''&&!due)badD++;
    const rx=prepx(g(r,'rep'));
    const dn=['si','x','hecha','hecho','true','1','completada','listo','terminada'].includes(nk(g(r,'done')));
    const u=g(r,'upd'),upd=typeof u==='number'?u:(Date.parse(u)||0);
    rt.push({id:String(g(r,'id')).trim(),title:title.slice(0,200),notes:String(g(r,'notes')).trim(),prio:pr[0],cat:String(g(r,'cat')).trim().slice(0,40),due,rep:rx[0],rd:rx[1],myday:'',done:dn,doneAt:dn?(upd||Date.now()):0,updatedAt:upd,ord:(typeof g(r,'ord')==='number'?g(r,'ord'):undefined),
      steps:String(g(r,'steps')).split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('✓ ')?{t:x.slice(2).trim(),d:true}:{t:x,d:false})});
  });
  const cc={},del={};
  const sh=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(1):[];
  const cl=[];
  (wb.Sheets['Categorías']?sh('Categorías'):sh('Colores')).forEach(r=>{const nm=String(r[0]).trim();if(!nm)return;if(!cl.includes(nm))cl.push(nm);const n=Number(r[1]);if(n>=1&&n<=8)cc[nm]=n-1});
  sh('Eliminadas').forEach(r=>{const n=Number(r[1]);if(r[0]&&n>0)del[String(r[0])]=n});
  return{rt,cc,del,cl,badP,badD};
}
function cleanTask(t){return{id:t.id||uid(),title:String(t.title),notes:t.notes||'',prio:(t.prio===''||P[t.prio])?t.prio:'p1',cat:t.cat||'',due:t.due||'',rep:t.rep||'',rd:Array.isArray(t.rd)?t.rd:[],myday:t.myday||'',done:!!t.done,doneAt:t.doneAt||0,updatedAt:t.updatedAt||0,ord:typeof t.ord==='number'?t.ord:undefined,steps:Array.isArray(t.steps)?t.steps:[]}}
function applyImport(rt,cc,del,mode,cl){
  cl=cl||[];
  if(mode==='replace'){
    if(!confirm('Esto reemplazará tus '+S.tasks.length+' tareas actuales por las '+rt.length+' del archivo. ¿Continuar?'))return'';
    S.tasks=rt.map(t=>({...t,id:t.id||uid(),updatedAt:t.updatedAt||Date.now()}));S.cc=cc;S.del=del;S.catList=[...cl];
    return'Archivo importado: '+rt.length+' tareas';
  }
  Object.keys(del).forEach(id=>{S.del[id]=Math.max(S.del[id]||0,del[id])});
  const seen=new Set(S.tasks.map(t=>nk(t.title)+'|'+nk(t.cat)));
  let add=0,upd=0,dup=0;
  rt.forEach(t=>{
    if(t.id){
      if(S.del[t.id]&&S.del[t.id]>=t.updatedAt)return;
      const k=S.tasks.findIndex(x=>x.id===t.id);
      if(k<0){S.tasks.push(t);add++}else if(t.updatedAt>(S.tasks[k].updatedAt||0)){S.tasks[k]=t;upd++}
    }else{
      const key=nk(t.title)+'|'+nk(t.cat);
      if(seen.has(key)){dup++;return}
      seen.add(key);t.id=uid();t.updatedAt=Date.now();S.tasks.push(t);add++;
    }
  });
  const n=S.tasks.length;
  S.tasks=S.tasks.filter(t=>!(S.del[t.id]&&S.del[t.id]>=(t.updatedAt||0)));
  S.cc=Object.assign({},cc,S.cc);
  S.catList=S.catList||[];cl.forEach(c=>{if(!S.catList.includes(c))S.catList.push(c)});
  const rem=n-S.tasks.length;
  return'Fusionado: '+add+' nuevas, '+upd+' actualizadas'+(rem?', '+rem+' eliminadas':'')+(dup?', '+dup+' ya existían':'');
}
async function importAny(f){
  try{
    let rt,cc={},del={},cl=[],badP=0,badD=0;
    if(/\.json$/i.test(f.name)){
      const d=JSON.parse(await readText(f));if(!d||!Array.isArray(d.tasks))throw 0;
      rt=d.tasks.filter(t=>t&&t.title).map(cleanTask);cc=d.cc||{};del=d.del||{};cl=d.catList||[];
    }else{({rt,cc,del,cl,badP,badD}=await readExcel(f))}
    if(!rt.length){toast('No encontré tareas en el archivo',4000);return}
    if(importMode==='merge'&&!confirm('Se leyeron '+rt.length+' tareas del archivo. ¿Fusionarlas con las tuyas?'))return;
    const msg=applyImport(rt,cc,del,importMode,cl);if(!msg)return;
    ensureOrd(S);syncCats();save();render();
    toast(msg+(badP?'. '+badP+' con prioridad no reconocida quedaron en la Bandeja':'')+(badD?'. '+badD+' con fecha no reconocida quedaron sin fecha':''),6000);
  }catch(e){toast(e&&e.message==='header'?'No encontré la columna “Tarea” en la primera fila. Descarga la plantilla para ver el formato.':'No pude leer el archivo. Verifica que sea un Excel (.xlsx)',5000)}
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c&&c.parentNode.id==='chips'){cat=c.dataset.c;render();return}
  const n=e.target.closest('#nav button');if(n){view=n.dataset.v;render();$('main').scrollTop=0;return}
  if(e.target.id==='fab'){openSheet(null);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const id=(a.closest('.card')||{dataset:{}}).dataset.id,i=+a.dataset.i;
  switch(a.dataset.act){
    case'tog':toggle(id);break;
    case'edit':openSheet(id);break;
    case'add':openSheet(null,a.dataset.p);break;
    case'close':closeSheet();break;
    case'save':saveDraft();break;
    case'del':if(confirm('¿Eliminar esta tarea?')){S.del[draft.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==draft.id);save();closeSheet();render();toast('Tarea eliminada')}break;
    case'stepadd':{const v=$('f-s');if(v.value.trim()){draft.steps.push({t:v.value.trim(),d:false});v.value='';renderSteps()}break}
    case'stepchk':draft.steps[i].d=!draft.steps[i].d;renderSteps();break;
    case'stepdel':draft.steps.splice(i,1);renderSteps();break;
    case'export':exportData();break;
    case'import':importMode='replace';$('xfile').click();break;
    case'merge':importMode='merge';$('xfile').click();break;
    case'share':shareData();break;
    case'bm':S.bm=a.dataset.m;save();render();break;
    case'addc':openSheet(null,'p1','',a.dataset.cat);break;
    case'qadd':qadd();break;
    case'wprev':wk--;render();break;
    case'wnext':wk++;render();break;
    case'addd':openSheet(null,'p1',a.dataset.d);break;
    case'tpl':downloadTemplate();break;
    case'catadd':{const v=$('newcat').value.trim();if(!v)break;if(cats().some(c=>nk(c)===nk(v))){toast('Esa categoría ya existe');break}S.catList.push(v);save();render();toast('Categoría agregada');break}
    case'catdel':{const c=a.dataset.c,n=S.tasks.filter(t=>t.cat===c);
      if(n.length&&!confirm('Hay '+n.length+' tareas con la categoría “'+c+'”. Quedarán sin categoría. ¿Continuar?'))break;
      n.forEach(t=>{t.cat='';t.updatedAt=Date.now()});S.catList=S.catList.filter(x=>x!==c);save();render();break}
    case'rdt':{const n=+a.dataset.n,k=draft.rd.indexOf(n);if(k<0)draft.rd.push(n);else draft.rd.splice(k,1);renderRd();break}
    case'sw':draft._cc=i;renderSw();break;
    case'clean':if(confirm('¿Borrar todas las tareas hechas?')){S.tasks.filter(t=>t.done).forEach(t=>S.del[t.id]=Date.now());S.tasks=S.tasks.filter(t=>!t.done);save();render();toast('Listo')}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&draft)closeSheet();
  if(e.key==='Escape'&&e.target.id==='q')toggleSearch(false);
  if(e.key==='Enter'&&e.target.id==='f-s'){e.preventDefault();document.querySelector('[data-act=stepadd]').click()}
  if(e.key==='Enter'&&e.target.id==='newcat'){e.preventDefault();document.querySelector('[data-act=catadd]').click()}
  if(e.key==='Enter'&&e.target.id==='qa'){e.preventDefault();qadd()}
  if(e.key==='Enter'&&e.target.id==='f-t'){e.preventDefault();saveDraft()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('ct')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-r'&&draft){setRep(e.target.value);return}
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  const c=e.target.closest('.card'),t=c&&S.tasks.find(x=>x.id===c.dataset.id);if(!t)return;
  if(f==='prio'){if(!e.target.value)return;t.prio=e.target.value;t.ord=nextOrd();t.updatedAt=Date.now();save();render();toast('Pasó al Tablero: '+P[t.prio])}
  else{t.cat=e.target.value.trim();t.updatedAt=Date.now();syncCats();save()}
});
function toggleSearch(on){const sb=$('sb');sb.hidden=!on;if(on)$('q').focus();else{$('q').value='';if(q){q='';render()}}}
$('sbtn').addEventListener('click',()=>toggleSearch($('sb').hidden));
$('qx').addEventListener('click',()=>toggleSearch(false));
$('q').addEventListener('input',e=>{
  q=nk(e.target.value);const b=document.querySelector('.board'),sl=b?b.scrollLeft:0,st=$('main').scrollTop;
  render();const b2=document.querySelector('.board');if(b2)b2.scrollLeft=sl;$('main').scrollTop=st;
});
document.addEventListener('input',e=>{if(e.target.id==='f-c'&&draft){draft._cc=null;renderSw()}});
document.addEventListener('click',e=>{if(Date.now()-lastDrag<350){e.stopPropagation();e.preventDefault()}},true);
let dg=null,lastDrag=0;
function place(){dg.g.style.left=(dg.cx-dg.ox)+'px';dg.g.style.top=(dg.cy-dg.oy)+'px'}
function colAt(){const e=document.elementFromPoint(dg.cx,dg.cy);return e&&e.closest('.col')}
function target(){
  const c=colAt();if(!c)return null;
  const cs=[...c.querySelectorAll('.card')].filter(k=>k!==dg.el);
  const i=cs.findIndex(k=>{const r=k.getBoundingClientRect();return dg.cy<r.top+r.height/2});
  return{col:c,before:i<0?null:cs[i],prev:i<0?(cs[cs.length-1]||null):(i>0?cs[i-1]:null)};
}
function clearMarks(){document.querySelectorAll('.col.over,.insb,.insa').forEach(x=>x.classList.remove('over','insb','insa'))}
function over(){
  clearMarks();const t=target();if(!t)return;t.col.classList.add('over');
  if(BM()==='prio'&&t.col.dataset.k!=='done'){if(t.before)t.before.classList.add('insb');else if(t.prev)t.prev.classList.add('insa')}
}
function startDrag(){
  if(!dg||dg.on)return;
  dg.on=true;document.body.classList.add('dragging');
  const r=dg.el.getBoundingClientRect(),g=dg.el.cloneNode(true);
  g.classList.add('ghost');g.style.width=r.width+'px';dg.ox=dg.x-r.left;dg.oy=dg.y-r.top;
  document.body.appendChild(g);dg.g=g;dg.el.classList.add('ph');
  if(navigator.vibrate)navigator.vibrate(25);
  dg.iv=setInterval(()=>{const b=document.querySelector('.board');if(!b)return;if(dg.cx<45)b.scrollLeft-=14;else if(dg.cx>innerWidth-45)b.scrollLeft+=14;const m=$('main');if(dg.cy<130)m.scrollTop-=12;else if(dg.cy>innerHeight-110)m.scrollTop+=12;over()},30);
  place();over();
}
function moveTo(id,k,tg){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(BM()==='cat'){if((t.cat||'')===k)return;t.cat=k;t.updatedAt=Date.now();save();render();toast('Movida a '+(k||'Sin categoría'));return}
  if(k==='done'){if(!t.done)toggle(id);return}
  const tk=x=>x&&S.tasks.find(y=>y.id===x.dataset.id);
  const b=tg&&tk(tg.before),pv=tg&&tk(tg.prev);
  let o;if(b&&pv)o=(pv.ord+b.ord)/2;else if(b)o=b.ord-1000;else if(pv)o=pv.ord+1000;else o=nextOrd();
  const same=!t.done&&t.prio===k;
  t.done=false;t.doneAt=0;t.prio=k;t.ord=o;t.updatedAt=Date.now();
  if(b&&pv&&Math.abs(b.ord-pv.ord)<1e-6)renumber();
  save();render();toast(same?'Tarea reordenada':'Movida a '+P[k]);
}
function endDrag(drop){
  if(!dg)return;clearTimeout(dg.h);
  if(dg.on){
    clearInterval(dg.iv);const tg=drop?target():null,c=tg&&tg.col;
    dg.g.remove();dg.el.classList.remove('ph');document.body.classList.remove('dragging');
    clearMarks();
    lastDrag=Date.now();
    if(c&&c.dataset.k!==undefined)moveTo(dg.id,c.dataset.k,tg);
  }
  dg=null;
}
document.addEventListener('pointerdown',e=>{
  if(view!=='board'||e.button>0||dg)return;
  const c=e.target.closest('.card');if(!c||e.target.closest('.chk'))return;
  dg={id:c.dataset.id,el:c,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,t:e.pointerType,on:false};
  if(e.pointerType!=='mouse')dg.h=setTimeout(startDrag,350);
});
document.addEventListener('pointermove',e=>{
  if(!dg)return;dg.cx=e.clientX;dg.cy=e.clientY;
  if(!dg.on){
    const mv=Math.hypot(dg.cx-dg.x,dg.cy-dg.y);
    if(dg.t==='mouse'){if(mv>6)startDrag()}else if(mv>10){clearTimeout(dg.h);dg=null}
    if(!dg||!dg.on)return;
  }
  place();over();
});
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('touchmove',e=>{if(dg&&dg.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.card'))e.preventDefault()});
$('xfile').addEventListener('change',e=>{if(e.target.files[0])importAny(e.target.files[0]);e.target.value=''});
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
